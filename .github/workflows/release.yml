name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to release (must match version.hpp)
        required: true
        type: string
      commit:
        description: Full commit SHA on main with passing CI (must match the tag)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unrar-release
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # Admission code is from this workflow's immutable main snapshot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authorize exact source through main ancestry and both CI jobs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: python3 scripts/authorize-release.py "$RELEASE_TAG" "$SOURCE_COMMIT"

  check:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          persist-credentials: false
      - name: Check release ref and source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py check-tag "$RELEASE_TAG"
      - name: Lint, release tests, Linux build and extraction tests
        run: bash scripts/check.sh

  build:
    needs: [authorize, check]
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      UNRAR_SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Check release ref and source
        run: python3 control/scripts/release.py check-tag "$RELEASE_TAG"
      - name: Native arm64 build and extraction tests
        run: bash control/scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-unrar-release
          path: control/.build/macos/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [authorize, build]
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
      UNRAR_SOURCE_ROOT: ${{ github.workspace }}/source
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      # The controller is the reviewed main snapshot; candidate scripts are data only.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-unrar-release
          path: control/.build/macos
      - name: Validate source, artifact, and required signing credentials
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          python3 control/scripts/release.py preflight sign "$RELEASE_TAG"
          python3 control/scripts/release.py validate-build control/.build/macos
      - name: Sign, notarize, and staple the disk image
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash control/scripts/sign-notarize.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized-unrar
          path: control/.build/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [authorize, package]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: notarized-unrar
          path: .build/release
      - name: Verify and smoke-test the signed disk image without credentials
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/verify-release.sh "$RELEASE_TAG"

  publish:
    needs: [authorize, package, verify]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
      UNRAR_SOURCE_ROOT: ${{ github.workspace }}/source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: notarized-unrar
          path: control/.build/release
      - name: Publish GitHub release, then update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bash control/scripts/publish.sh "$RELEASE_TAG"
